    <text x="64" y="98" fill="#94A3B8" font-size="15">Projects, releases, orchestration, and audit</text>

    <rect x="64" y="138" width="232" height="102" rx="18" fill="#0F172A" stroke="#334155"/>
    <text x="88" y="177" fill="#5EEAD4" font-size="14" font-weight="700" letter-spacing="1.2">DEFINE</text>
    <text x="88" y="207" fill="#F8FAFC" font-size="22" font-weight="700">Project + Variables</text>
    <text x="88" y="229" fill="#94A3B8" font-size="14">Environments · Lifecycles · Channels</text>

    <rect x="328" y="138" width="232" height="102" rx="18" fill="#0F172A" stroke="#334155"/>
    <text x="352" y="177" fill="#22D3EE" font-size="14" font-weight="700" letter-spacing="1.2">PACKAGE</text>
    <text x="352" y="207" fill="#F8FAFC" font-size="22" font-weight="700">Release</text>
    <text x="352" y="229" fill="#94A3B8" font-size="14">Snapshots · versions · history</text>

    <rect x="592" y="138" width="232" height="102" rx="18" fill="#0F172A" stroke="#2DD4BF" stroke-width="2"/>
    <text x="616" y="177" fill="#2DD4BF" font-size="14" font-weight="700" letter-spacing="1.2">ORCHESTRATE</text>
