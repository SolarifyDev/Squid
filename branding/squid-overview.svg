<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Squid deployment overview</title>
  <desc id="desc">Squid orchestrates releases and approvals to Kubernetes, Tentacle, SSH, and OpenClaw targets.</desc>

  <rect width="1200" height="560" rx="30" fill="#08111F"/>
  <rect x="1" y="1" width="1198" height="558" rx="29" stroke="#1E293B" stroke-width="2"/>

