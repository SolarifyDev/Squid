{{- if include "squid-server.ownsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "squid-server.fullname" . }}
  labels:
    {{- include "squid-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.admin.password }}
  admin-password: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.database.connectionString }}
  database: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.redis.connectionString }}
  redis: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
