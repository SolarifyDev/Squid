# ============================================================================
# E2E upgrade matrix (D3, 1.6.0) — exercise the real install-tentacle.sh +
# real UI-dispatched upgrade flow across every supported distro on every
# PR, closing the 1.4.4-era "yum path unit-tested but never E2E-tested"
# coverage gap.
#
# Each matrix cell:
#   1. Launch a systemd-enabled Docker container for the target distro.
#   2. Install prerequisites (curl, sudo, gnupg) using the distro's
#      native package manager.
#   3. Run install-tentacle.sh from the PR head (installs latest from
#      Squid APT/RPM repo — the version isn't what's under test here;
#      the installation CONTRACT is).
#   4. Assert the installer's critical side effects:
#        - binary in place at /usr/local/bin/squid-tentacle
#        - APT repo / RPM repo file written (distro-appropriate)
#        - sudoers rule installed + passes visudo -c
#        - root-owned package-install helper granted by sudoers, and a REAL
#          apt/dnf run through it (reinstall of the version just installed)
#   5. Teardown.
#
# The sudoers-compat job additionally runs the real installer block against
# classic sudo 1.8.x/1.9.x and sudo-rs in throwaway containers and drives the
# server-rendered apt/yum snippets through each (SudoersCompatibilityE2ETests).
#
# What this workflow DOES NOT do:
#   - Run a full registered-tentacle UI-upgrade (needs a running Squid
#     server; that lives in deploy/scripts/e2e-upgrade-test.sh which the
#     operator runs manually against a staging server).
#   - Validate the agent binary's runtime behaviour (covered by
#     Squid.Tentacle.Tests + Squid.E2ETests).
#
# Trigger: every PR affecting install-tentacle.sh, upgrade-linux-tentacle.sh,
# or the Phase 2 Part 2 method adapters. Also manually dispatchable.
# ============================================================================
name: E2E Upgrade Matrix

on:
  pull_request:
    paths:
      - 'deploy/scripts/install-tentacle.sh'
      - 'deploy/scripts/e2e-upgrade-test.sh'
      - 'deploy/packaging/**'
      - 'src/Squid.Core/Resources/Upgrade/upgrade-linux-tentacle.sh'
      - 'src/Squid.Core/Services/Machines/Upgrade/Methods/**'
      - 'tests/Squid.LinuxTentacleE2ETests/SudoersCompatibilityE2ETests.cs'
      - 'tests/Squid.LinuxTentacleE2ETests/Infrastructure/sudoers-seam.sh'
      - '.github/workflows/e2e-upgrade-matrix.yml'
  workflow_dispatch:

jobs:
  install-smoke-test:
    name: install-tentacle.sh on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-20.04
            image: jrei/systemd-ubuntu:20.04
            pkg_mgr: apt
          - distro: ubuntu-22.04
            image: jrei/systemd-ubuntu:22.04
            pkg_mgr: apt
          - distro: ubuntu-24.04
            image: jrei/systemd-ubuntu:24.04
            pkg_mgr: apt
          - distro: debian-12
            image: jrei/systemd-debian:12
            pkg_mgr: apt
          # sudo-rs (the default sudo since 26.04) rejects argument wildcards in
          # sudoers. No systemd-enabled 26.04 image is published (jrei has none),
          # and install-tentacle.sh never calls systemctl, so this leg runs the
          # plain image with a sleep PID 1.
          - distro: ubuntu-26.04
            image: ubuntu:26.04
            pkg_mgr: apt
            init: none
          # RHEL family uses each distro's OWN systemd-enabled init image rather than a
          # jrei/* one. jrei publishes no systemd-rockylinux or systemd-almalinux repo at
          # all (`docker pull` → "repository does not exist"), so both legs had never once
          # started a container. The distro-official images are also not subject to a third
          # party pruning old tags, which is what removed jrei/systemd-fedora:40.
          - distro: rockylinux-9
            image: rockylinux/rockylinux:9-ubi-init
            pkg_mgr: dnf
          - distro: almalinux-9
            image: almalinux/9-init:9
            pkg_mgr: dnf
          - distro: fedora-41
            image: jrei/systemd-fedora:41
            pkg_mgr: dnf
    steps:
      - uses: actions/checkout@v4

      - name: Launch container without systemd
        if: matrix.init == 'none'
        run: docker run -d --name squid-test-${{ matrix.distro }} --hostname squid-test-${{ matrix.distro }} ${{ matrix.image }} sleep infinity

      - name: Launch systemd container
        if: matrix.init != 'none'
        run: |
          docker run -d \
            --name squid-test-${{ matrix.distro }} \
            --hostname squid-test-${{ matrix.distro }} \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run \
            --tmpfs /run/lock \
            ${{ matrix.image }}

          # Wait for systemd to be ready.
          for i in $(seq 1 15); do
            if docker exec squid-test-${{ matrix.distro }} systemctl is-system-running 2>/dev/null | grep -qE "running|degraded"; then
              break
            fi
            sleep 2
          done

          docker exec squid-test-${{ matrix.distro }} systemctl --version | head -1

      - name: Install prerequisites
        run: |
          if [ "${{ matrix.pkg_mgr }}" = "apt" ]; then
            docker exec squid-test-${{ matrix.distro }} bash -c \
              'export DEBIAN_FRONTEND=noninteractive && apt-get update -qq && apt-get install -y -qq curl sudo gnupg ca-certificates'
          else
            # --allowerasing: the UBI-based Rocky/Alma init images ship curl-minimal, which
            # CONFLICTS with the curl package ("conflicting requests", dnf exits non-zero)
            # even though it already provides /usr/bin/curl. Allowing the swap keeps the
            # step working on both those images and on Fedora, which ships full curl.
            docker exec squid-test-${{ matrix.distro }} bash -c \
              'dnf install -y -q --allowerasing curl sudo gnupg2 ca-certificates procps-ng which'
          fi

      # Staged under /root, NOT /tmp: systemd 256+ (Fedora 41) activates tmp.mount, so /tmp
      # becomes a tmpfs that shadows whatever `docker cp` wrote into the image layer — the
      # copy reports success and the file is then invisible to `bash`. el9's systemd 252
      # leaves /tmp alone, which is why only the newer distro would have hit it.
      - name: Copy install-tentacle.sh from PR
        run: docker cp deploy/scripts/install-tentacle.sh squid-test-${{ matrix.distro }}:/root/install-tentacle.sh

      - name: Run install-tentacle.sh
        run: docker exec squid-test-${{ matrix.distro }} bash /root/install-tentacle.sh

      - name: Verify installer side effects
        run: |
          # Assertion 1: tentacle binary installed + runnable
          docker exec squid-test-${{ matrix.distro }} squid-tentacle version

          # Assertion 2: distro-appropriate repo file written
          if [ "${{ matrix.pkg_mgr }}" = "apt" ]; then
            docker exec squid-test-${{ matrix.distro }} test -f /etc/apt/sources.list.d/squid.list
            docker exec squid-test-${{ matrix.distro }} test -f /etc/apt/apt.conf.d/99-squid-direct.conf
          else
            docker exec squid-test-${{ matrix.distro }} test -f /etc/yum.repos.d/squid-tentacle.repo
          fi

          # Assertion 3: sudoers rule installed + visudo-valid
          docker exec squid-test-${{ matrix.distro }} test -f /etc/sudoers.d/squid-tentacle-upgrade
          docker exec squid-test-${{ matrix.distro }} visudo -c -f /etc/sudoers.d/squid-tentacle-upgrade

          # Assertion 4: the rule actually grants squid-tentacle the package-install helper.
          # Asserted on the sudoers file rather than via `sudo -U`, because `sudo -U <user> -l`
          # runs PAM account management for the TARGET user, and the RHEL-family init images
          # cannot satisfy it ("PAM account management error: Authentication service cannot
          # retrieve authentication info" — systemd-logind is inactive in the container). That
          # is a container limitation, not a product defect: the file is already proven valid
          # sudoers syntax by assertion 3's visudo -c, and this pins that it grants the right
          # user a package-manager command.
          docker exec squid-test-${{ matrix.distro }} \
            grep -qx 'squid-tentacle ALL=(root) NOPASSWD: /usr/libexec/squid-tentacle/package-install' /etc/sudoers.d/squid-tentacle-upgrade \
            || (echo "::error::squid-tentacle user has no bare-path package-install helper sudoers rule"; exit 1)

          # Where sudo CAN run, additionally prove sudo itself enumerates the rule. Never
          # silently skipped — an unavailable sudo is reported so the weaker coverage is visible.
          if docker exec squid-test-${{ matrix.distro }} sudo -U squid-tentacle -nl 2>/dev/null \
               | grep -q "package-install"; then
            echo "sudo -U enumerated the rule (full verification)"
          else
            echo "::notice::sudo -U could not run in this container (PAM); relied on the sudoers-file assertion only"
          fi

      - name: Verify package-install helper drives the real package manager
        run: |
          C=squid-test-${{ matrix.distro }}
          HELPER=/usr/libexec/squid-tentacle/package-install

          # Root-owned 0755, in a root-owned dir: a helper the service user could
          # rewrite would be a root shell.
          for p in "$HELPER" "$(dirname "$HELPER")"; do
            OWN=$(docker exec $C stat -c '%U:%G:%a' "$p")
            [ "$OWN" = "root:root:755" ] || { echo "::error::$p is $OWN, expected root:root:755"; exit 1; }
          done

          # Reinstall the version the installer just put down, through the helper,
          # against the real Squid repo: proves the helper's exact apt/dnf argv.
          if [ "${{ matrix.pkg_mgr }}" = "apt" ]; then
            V=$(docker exec $C dpkg-query -W -f='${Version}' squid-tentacle); M=apt
          else
            V=$(docker exec $C rpm -q squid-tentacle --qf '%{VERSION}-%{RELEASE}'); M=dnf
          fi
          echo "installed squid-tentacle version: $V"

          # As the service user through the host's own sudo where PAM allows it
          # (the RHEL-family init images cannot satisfy sudo's PAM account check,
          # see assertion 4); otherwise as root, reported so the gap is visible.
          if docker exec $C su -s /bin/sh squid-tentacle -c "sudo -n -l $HELPER $M $V" >/dev/null 2>&1; then
            docker exec $C su -s /bin/sh squid-tentacle -c "sudo -n $HELPER $M $V"
          else
            [ "${{ matrix.pkg_mgr }}" = "apt" ] && { echo "::error::sudo does not grant $HELPER to squid-tentacle"; exit 1; }
            echo "::notice::sudo could not run as squid-tentacle in this container (PAM); ran the helper as root"
            docker exec $C "$HELPER" $M "$V"
          fi

          # The helper refuses anything but (manager, strict version).
          RC=0; docker exec $C "$HELPER" $M "1.0 /tmp/evil.pkg" || RC=$?
          [ "$RC" = "65" ] || { echo "::error::helper accepted an injected version (exit $RC, expected 65)"; exit 1; }

      - name: Teardown
        if: always()
        run: docker rm -f squid-test-${{ matrix.distro }} || true

  sudoers-compat:
    name: sudoers on classic sudo + sudo-rs
    runs-on: ubuntu-latest
    env:
      NUGET_CONFIG: ${{ github.workspace }}/NuGet.Config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Disable unreachable NuGet source
        run: dotnet nuget disable source SJ.Nuget --configfile "$NUGET_CONFIG"

      - name: Restore
        run: dotnet restore tests/Squid.LinuxTentacleE2ETests/Squid.LinuxTentacleE2ETests.csproj --configfile "$NUGET_CONFIG"

      - name: Run SudoersCompatibilityE2ETests
        run: |
          dotnet test tests/Squid.LinuxTentacleE2ETests/Squid.LinuxTentacleE2ETests.csproj \
            --configuration Release --no-restore \
            --filter "Category=LinuxTentacleSudoersCompatE2E" \
            --logger "console;verbosity=detailed"

  # ── Alpine (musl) track ────────────────────────────────────────────────────
  # Gated behind D2's musl builds being published. If the PR doesn't also
  # include musl tarballs in a release, the install-tentacle.sh will 404
  # on the musl RID; this job catches that regression too.
  alpine-musl-smoke-test:
    name: install-tentacle.sh on Alpine (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Launch Alpine OpenRC container
        # Alpine doesn't ship systemd by default; using an OpenRC-ready
        # image is enough for this smoke test (we're only validating the
        # installer's static side effects, not service install which
        # requires the target distro's init system).
        run: |
          docker run -d --name squid-test-alpine --hostname squid-test-alpine alpine:3.20 sleep 3600
          docker exec squid-test-alpine apk add --no-cache curl sudo bash gnupg shadow

      - name: Copy install-tentacle.sh from PR
        run: docker cp deploy/scripts/install-tentacle.sh squid-test-alpine:/tmp/install-tentacle.sh

      - name: Probe libc detection
        run: |
          # D2 (1.6.0) adds musl detection via `ldd --version`. Pin that
          # Alpine's ldd is correctly identified as musl — catches a
          # regression in the detection logic before it ships to operators.
          docker exec squid-test-alpine bash -c 'ldd --version 2>&1 | grep -qi musl' \
            || (echo "::error::Alpine ldd output did not match musl — D2 libc detection would misidentify as glibc"; exit 1)

      - name: Teardown
        if: always()
        run: docker rm -f squid-test-alpine || true
